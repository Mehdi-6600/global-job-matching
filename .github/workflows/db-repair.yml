name: Database repair

# Applies docs/repair/01-schema.sql + 02-migration-history.sql to the database
# behind DATABASE_URL, then verifies /api/jobs.
#
# Both files are idempotent and contain no DROP / DELETE / TRUNCATE, so running
# this twice is harmless.
#
# WHY THIS EXISTS: the repair has to reach the production database, but it must
# not require a paid database plan, a laptop, or a terminal. GitHub Actions on a
# public repository is free, and the run is logged for audit.
#
# SETUP (once): repository → Settings → Secrets and variables → Actions →
# New repository secret
#     name : DATABASE_URL
#     value: the Postgres connection string (Neon: use the *direct* host, not the
#            -pooler one; DDL goes through it more reliably)
#
# RUN:
#   * Actions → "Database repair" → Run workflow (after this file is on main), or
#   * push a change to .github/db-repair-request (works from any branch).
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN to apply the repair to the database in DATABASE_URL'
        required: true
        default: ''
  push:
    paths: [.github/db-repair-request]

permissions:
  contents: write

concurrency:
  group: db-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Apply additive repair SQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Check the confirmation and the secret
        env:
          CONFIRM: ${{ inputs.confirmation || 'RUN' }}
          DB: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "RUN" ]; then
            echo "::error::Confirmation must be exactly RUN (got '$CONFIRM'). Nothing was executed."
            exit 1
          fi
          if [ -z "${DB:-}" ]; then
            echo "::error::Secret DATABASE_URL is not set. Repository → Settings → Secrets and variables → Actions → New repository secret, name DATABASE_URL. Nothing was executed."
            exit 1
          fi
          echo "::add-mask::$DB"
          echo "secret present ($(printf '%s' "$DB" | wc -c) chars)"

      - name: Pre-flight (read-only)
        env:
          DB: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$DB" -v ON_ERROR_STOP=1 -X -q <<'SQL'
          SELECT current_database() AS database,
                 current_user       AS role,
                 split_part(version(), ' ', 2) AS pg_version;
          SELECT count(*) AS recorded_migrations FROM "_prisma_migrations";
          SELECT to_regclass('public."JobSource"')          IS NOT NULL AS job_source_exists,
                 to_regclass('public."JobSourceListing"')   IS NOT NULL AS job_source_listing_exists,
                 to_regclass('public."OutreachAttempt"')    IS NOT NULL AS outreach_attempt_exists;
          SELECT count(*) AS job_rows FROM "Job";
          SQL

      - name: Apply 01-schema.sql (additive only)
        env:
          DB: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          if ! psql "$DB" -v ON_ERROR_STOP=1 -X -q -f docs/repair/01-schema.sql > /tmp/schema.log 2>&1; then
            echo "::error::01-schema.sql failed. Last lines of the log:"
            tail -40 /tmp/schema.log
            exit 1
          fi
          # "already exists, skipping" notices are expected on a re-run
          grep -v 'already exists, skipping' /tmp/schema.log | tail -30 || true
          echo "01-schema.sql finished in $(( $(date +%s) - start ))s"

      - name: Apply 02-migration-history.sql
        env:
          DB: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$DB" -v ON_ERROR_STOP=1 -X -q -f docs/repair/02-migration-history.sql

      - name: Verify the schema
        env:
          DB: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$DB" -v ON_ERROR_STOP=1 -X -q \
            -c "SELECT count(*) AS migrations, count(finished_at) AS applied FROM \"_prisma_migrations\";" \
            -c "SELECT migration_name FROM \"_prisma_migrations\" WHERE finished_at IS NULL;" \
            -c "SELECT count(*) AS jobs, count(*) FILTER (WHERE \"featured\") AS featured FROM \"Job\";"
          missing="$(psql "$DB" -v ON_ERROR_STOP=1 -X -q -t -A <<'SQL'
          WITH expected(tbl, col) AS (VALUES
            ('Job','featured'), ('Job','featuredUntil'), ('Job','featuredTxId'),
            ('Transaction','jobId'), ('Transaction','featuredDuration'),
            ('Transaction','expectedCryptoAmount'), ('Transaction','rateUsd'),
            ('Transaction','recipientAddress'), ('Transaction','paymentIntentId'),
            ('PaymentIntent','jobId'), ('PaymentIntent','featuredDuration'),
            ('Profile','resumeUrl'), ('JobAlert','frequency'), ('Interview','applicationId'))
          SELECT coalesce(string_agg(tbl || '.' || col, ', '), '')
          FROM expected e
          WHERE NOT EXISTS (
            SELECT 1 FROM information_schema.columns c
            WHERE c.table_schema = 'public' AND c.table_name = e.tbl AND c.column_name = e.col);
          SQL
          )"
          if [ -n "$missing" ]; then
            echo "::error::columns still missing: $missing"
            exit 1
          fi
          echo "✓ every column the app expects exists"

      - name: Verify the live API
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            code="$(curl -s -o /tmp/jobs.json -w '%{http_code}' --max-time 45 \
              'https://global-job-matching.vercel.app/api/jobs?limit=2' || true)"
            echo "attempt $i: /api/jobs → $code"
            [ "$code" = "200" ] && break
            sleep 20
          done
          [ -f /tmp/jobs.json ] && head -c 300 /tmp/jobs.json || true
          echo
          [ "$code" = "200" ] || { echo "::error::/api/jobs still failing (HTTP $code)"; exit 1; }

      - name: Publish the outcome as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Database repair run (${{ job.status }})"
            echo
            echo "Triggered by \`${{ github.event_name }}\` on \`${{ github.sha }}\`."
            echo "Applied \`docs/repair/01-schema.sql\` then \`docs/repair/02-migration-history.sql\`."
            echo
            echo "- [run log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > /tmp/comment.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat /tmp/comment.md)" >/dev/null && echo "comment posted"
