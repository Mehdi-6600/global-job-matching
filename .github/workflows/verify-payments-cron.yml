name: Verify crypto payments

# OPTIONAL external backstop.
#
# The 10-minute sweep normally runs inside the app (src/lib/payment/
# sweep-scheduler.ts) and needs no secret, no scheduler and no paid plan — see
# docs/PAYMENT-SWEEP.md. This workflow is only useful as an independent second
# pair of eyes: it calls the same endpoint from GitHub's infrastructure.
#
# Requires the repository secret CRON_SECRET (same value as the Vercel env var).
# Without that secret the job is a no-op.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-payments-cron
  cancel-in-progress: false

jobs:
  sweep:
    name: Call /api/cron/verify-payments
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger verification endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://global-job-matching.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set for this repository."
            echo "Skipping the 10-minute sweep; the daily Vercel cron still runs."
            exit 0
          fi

          code=$(curl -sS -o /tmp/verify-payments.json -w '%{http_code}' \
            --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/verify-payments")

          echo "HTTP $code"
          cat /tmp/verify-payments.json

          if [ "$code" != "200" ]; then
            echo "::warning::/api/cron/verify-payments returned HTTP $code"
            exit 1
          fi
