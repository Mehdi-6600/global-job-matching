name: Live site verification

# Temporary probe used to verify a production deployment from outside the
# sandbox (the sandbox itself cannot reach *.vercel.app). Push- or manually-run.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL to probe
        required: false
        default: https://global-job-matching.vercel.app
  push:
    branches: [arena/a17bbb2a-global-job-matching]
    paths: [.github/workflows/live-verify.yml]

permissions:
  contents: write

jobs:
  probe:
    name: HTTP matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe
        env:
          BASE: ${{ inputs.base_url || 'https://global-job-matching.vercel.app' }}
        run: |
          set -o pipefail
          python3 scripts/live-probe.py "$BASE" | tee /tmp/report.txt

      - name: Publish report as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ -f /tmp/report.txt ] || exit 0
          {
            echo 'Live verification report'
            echo ''
            echo '```'
            head -c 55000 /tmp/report.txt
            echo '```'
          } > /tmp/comment.md
          gh api -X POST "repos/$GITHUB_REPOSITORY/commits/$SHA/comments" \
            -f body="$(cat /tmp/comment.md)" >/dev/null && echo "comment posted on $SHA"
